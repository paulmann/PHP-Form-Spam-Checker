<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="PHP Form Spam Checker 2 — Layered anti-spam pipeline and HTTP firewall for any PHP form: 20 checks, 9 WAF rules, evidence for every verdict.">
